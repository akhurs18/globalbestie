[build]
  command = "node scripts/check-static-app.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "python3 -m http.server 4173"
  targetPort = 4173
  port = 8888
  framework = "#custom"

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/portal.html"
[headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[redirects]]
from = "/portal"
to = "/portal.html"
status = 200

[[redirects]]
from = "/api/scraper"
to = "/.netlify/functions/scraper"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
