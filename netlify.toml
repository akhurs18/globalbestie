[build]
  # Build pipeline (deploy blocks if any step fails):
  #   1. check-static-app   — builds dist/ and asserts DOM presence.
  #   2. playwright install — pulls the headless Chromium binary (~60 MB).
  #      Netlify caches node_modules but not ~/.cache/ms-playwright, so
  #      this runs cold each build. ~30-60s acceptable for the safety net.
  #   3. check-rendered-app — loads index + portal at 3 viewports in real
  #      Chromium and blocks the deploy if any layout invariant fails
  #      (horizontal scroll, H1 wrap, tiny touch targets, low-contrast
  #      banners). The guardrail that catches mobile regressions before
  #      customers see them.
  #
  # The Chromium install is made non-fatal (|| echo) and the render check runs
  # with --allow-skip: a transient cold-download failure of the browser binary
  # then SKIPS the render net instead of blocking the deploy (it's a safety
  # net, not a correctness gate). Layout assertion failures still block.
  command = "node scripts/check-static-app.mjs && (npx playwright install chromium || echo '[build] chromium install failed — render check will skip') && node scripts/check-rendered-app.mjs --allow-skip"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "python3 -m http.server 4173"
  targetPort = 4173
  port = 8888
  framework = "#custom"

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  # Content Security Policy — locks down what the browser can load.
  # `unsafe-inline` is required because both portal.html and index.html
  # have inline event handlers (onerror on <img>). 'unsafe-eval' is not
  # allowed. images.weserv.nl is whitelisted for the proxy image CDN.
  # Supabase host is whitelisted for direct storage object URLs.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://images.weserv.nl https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/portal.html"
[headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/ads.html"
[headers.values]
  X-Robots-Tag = "noindex, nofollow"

# Content-hashed minified bundles (built by check-static-app.mjs). The hash
# in the filename changes whenever the content does, so these are safe to
# cache forever — repeat visits skip the download entirely.
[[headers]]
for = "/assets/v/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/portal"
to = "/portal.html"
status = 200

[[redirects]]
from = "/ads"
to = "/ads.html"
status = 200

[[redirects]]
from = "/api/scraper"
to = "/.netlify/functions/scraper"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
